[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commit-message-generator"
version = "0.1.0"
description = "A research project for generating Git commit messages from diffs and docstrings from code."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Commit Message Generator Contributors"},
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
]

[project.scripts]
commitgen = "commitgen.application.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
